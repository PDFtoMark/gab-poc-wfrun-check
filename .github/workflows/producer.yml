name: producer
on:
  push:
    branches: [feat-producer]
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p out && echo '<testsuite name="x"><testcase name="t"/></testsuite>' > out/results.xml
      - uses: actions/upload-artifact@v4
        with:
          name: test-results-marker
          path: out/results.xml
